<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>视频封面 02 - 告别原厂繁琐</title>
  <style>
    @font-face {
      font-family: 'NotoSansSC';
      src: url('./assets/fonts/NotoSansSC-chinese-simplified-700.woff2') format('woff2');
      font-weight: 700;
      font-display: block;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #f8fafc;
      font-family: 'NotoSansSC', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #0f172a;
      position: relative;
    }

    .bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 15% 20%, #ffffff 0%, rgba(241, 245, 249, 0.95) 55%, #e2e8f0 100%);
      z-index: 1;
    }

    .top-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #ef4444, #f97316, #2563eb);
      z-index: 10;
    }

    .layout {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 60px 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 50px;
    }

    .left-col {
      flex: 0.92;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 22px;
      font-weight: 700;
      width: fit-content;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
    }

    .pill-badge .red-accent {
      color: #f87171;
    }

    .main-title {
      font-size: 88px;
      font-weight: 700;
      line-height: 1.12;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .main-title .red {
      color: #dc2626;
    }

    .main-title .blue {
      color: #2563eb;
    }

    .sub-hook {
      font-size: 30px;
      font-weight: 700;
      color: #475569;
      line-height: 1.4;
    }

    .sub-hook .bold-black {
      color: #0f172a;
    }

    .ux-cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 6px;
    }

    .ux-card-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px 26px;
      width: fit-content;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }

    .ux-card-item.primary {
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .ux-icon-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #2563eb;
    }

    .ux-card-text {
      font-size: 26px;
      font-weight: 700;
      color: #1e293b;
    }

    .ux-card-text span {
      color: #2563eb;
    }

    .chips-row {
      display: flex;
      gap: 14px;
    }

    .chip-item {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }

    .right-col {
      flex: 1.38;
      position: relative;
      perspective: 1400px;
    }

    .corner-tag {
      position: absolute;
      top: -16px;
      right: 40px;
      background: #dc2626;
      color: #ffffff;
      padding: 8px 24px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(220, 38, 38, 0.28);
      z-index: 10;
    }

    .window-frame {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 20px;
      overflow: hidden;
      transform: rotateY(-10deg) rotateX(3deg) scale(1.08);
      transform-origin: center right;
      box-shadow: 
        -25px 35px 80px rgba(15, 23, 42, 0.18),
        0 4px 20px rgba(15, 23, 42, 0.06);
    }

    .win-bar {
      background: #f1f5f9;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.r { background: #f87171; }
    .dot.y { background: #fbbf24; }
    .dot.g { background: #34d399; }

    .win-title {
      font-size: 15px;
      font-weight: 700;
      color: #334155;
    }

    .win-badge {
      font-size: 13px;
      font-weight: 700;
      color: #059669;
      background: #d1fae5;
      padding: 4px 12px;
      border-radius: 9999px;
    }

    .win-img {
      width: 100%;
      height: auto;
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="top-accent-bar"></div>
  <div class="bg"></div>

  <div class="layout">
    <!-- 左侧超大字 -->
    <div class="left-col">
      <div class="pill-badge">
        <span>【玩家自制】</span>
        <span class="red-accent">告别原厂繁琐反人类设计</span>
      </div>

      <h1 class="main-title">
        别再忍受原厂了！<br>
        换上这款 <span class="blue">纯净自制驱动</span>
      </h1>

      <div class="sub-hook">
        星闪悦动磁轴键盘专属 · <span class="bold-black">交互体验全面升级</span>
      </div>

      <div class="ux-cards">
        <div class="ux-card-item primary">
          <div class="ux-icon-dot"></div>
          <div class="ux-card-text">
            <span>界面清爽通透</span> · 拒绝花哨，按键逻辑一目了然
          </div>
        </div>

        <div class="chips-row">
          <div class="chip-item">彻底告别开机后台常驻</div>
          <div class="chip-item">曲线实时拖拽 · 零门槛上手</div>
        </div>
      </div>
    </div>

    <!-- 右侧浅色实机高级按键窗口 -->
    <div class="right-col">
      <div class="corner-tag">
        高级按键交互页
      </div>

      <div class="window-frame">
        <div class="win-bar">
          <div class="dots">
            <div class="dot r"></div>
            <div class="dot y"></div>
            <div class="dot g"></div>
          </div>
          <div class="win-title">AstraFlux-HUB | 高级按键矩阵与交互设置</div>
          <div class="win-badge">0 后台运行</div>
        </div>
        <img class="win-img" src="assets/latest_light/v113_light_advanced.png" alt="高级按键浅色界面">
      </div>
    </div>
  </div>
</body>
</html>
