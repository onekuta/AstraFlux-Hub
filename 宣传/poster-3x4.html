<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>宣传海报 3:4 - 玩家自制好用驱动</title>
  <style>
    @font-face {
      font-family: 'NotoSansSC';
      src: url('./assets/fonts/NotoSansSC-chinese-simplified-700.woff2') format('woff2');
      font-weight: 700;
      font-display: block;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1200px;
      height: 1600px;
      overflow: hidden;
      background: #f8fafc;
      font-family: 'NotoSansSC', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #0f172a;
      position: relative;
    }

    .bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 18%, #ffffff 0%, rgba(241, 245, 249, 0.95) 55%, #e2e8f0 100%);
      z-index: 1;
    }

    .top-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #2563eb, #38bdf8, #6366f1);
      z-index: 10;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 52px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 顶部 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.1);
    }

    .brand-text {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-v {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      font-size: 13px;
      padding: 3px 10px;
      border-radius: 9999px;
    }

    .top-status {
      background: #0f172a;
      color: #ffffff;
      padding: 6px 18px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
    }

    /* 核心超大字标题 */
    .hero-head {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
    }

    .pill-eyebrow {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      padding: 6px 20px;
      border-radius: 9999px;
      font-size: 17px;
      font-weight: 700;
    }

    .main-h1 {
      font-size: 68px;
      font-weight: 700;
      line-height: 1.15;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .main-h1 .blue {
      color: #2563eb;
    }

    /* 中部浅色实机大图 */
    .app-window-box {
      width: 100%;
      position: relative;
      margin: 10px 0;
    }

    .corner-tag {
      position: absolute;
      top: -14px;
      right: 25px;
      background: #2563eb;
      color: #ffffff;
      padding: 6px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      z-index: 5;
    }

    .window-frame {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 
        0 20px 50px rgba(15, 23, 42, 0.1),
        0 4px 14px rgba(15, 23, 42, 0.05);
    }

    .win-head {
      background: #f1f5f9;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
    }

    .dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot.r { background: #f87171; }
    .dot.y { background: #fbbf24; }
    .dot.g { background: #34d399; }

    .win-title {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
    }

    .win-status {
      font-size: 12px;
      font-weight: 700;
      color: #2563eb;
      background: #dbeafe;
      padding: 2px 8px;
      border-radius: 9999px;
    }

    .win-img {
      width: 100%;
      height: auto;
      max-height: 720px;
      object-fit: cover;
      object-position: top center;
      display: block;
      background: #ffffff;
    }

    /* 3 个交互亮点大卡片 */
    .point-rows {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .point-item {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    .point-item.primary {
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .item-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    .point-item.primary .item-title {
      color: #1d4ed8;
    }

    .item-tag {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 4px 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="top-accent-bar"></div>
  <div class="bg"></div>

  <div class="container">
    <!-- 顶部 -->
    <header class="top-bar">
      <div class="brand-wrap">
        <img class="brand-logo" src="assets/logo.png" alt="AstraFlux">
        <div class="brand-text">
          ASTRAFLUX-HUB
          <span class="badge-v">最新正式版</span>
        </div>
      </div>

      <div class="top-status">
        【玩家自制】纯净开源
      </div>
    </header>

    <!-- 核心文字区 -->
    <section class="hero-head">
      <div class="pill-eyebrow">
        星闪悦动磁轴方案专属 · 驱动交互体验全面革新
      </div>

      <h1 class="main-h1">
        星闪悦动磁轴键盘<br>
        <span class="blue">交互最舒服的自制驱动！</span>
      </h1>
    </section>

    <!-- 中部浅色实机大图 -->
    <div class="app-window-box">
      <div class="corner-tag">
        触发死区直观调校
      </div>

      <div class="window-frame">
        <div class="win-head">
          <div class="dots">
            <div class="dot r"></div>
            <div class="dot y"></div>
            <div class="dot g"></div>
          </div>
          <div class="win-title">AstraFlux-HUB | 磁轴触发与死区直观标定</div>
          <div class="win-status">0 后台</div>
        </div>
        <img class="win-img" src="assets/latest_light/v113_light_trigger.png" alt="浅色实机截图">
      </div>
    </div>

    <!-- 3 个交互卖点行 -->
    <div class="point-rows">
      <div class="point-item primary">
        <div class="item-title">直观可视拖拽调校</div>
        <div class="item-tag">按键行程一目了然</div>
      </div>

      <div class="point-item">
        <div class="item-title">纯净零后台 · 绝不常驻进程</div>
        <div class="item-tag">用完即关</div>
      </div>

      <div class="point-item">
        <div class="item-title">告别原厂繁琐反人类设计</div>
        <div class="item-tag">零门槛上手</div>
      </div>
    </div>
  </div>
</body>
</html>
