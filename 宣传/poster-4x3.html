<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>宣传海报 4:3 - 玩家自制好用驱动</title>
  <style>
    @font-face {
      font-family: 'NotoSansSC';
      src: url('./assets/fonts/NotoSansSC-chinese-simplified-700.woff2') format('woff2');
      font-weight: 700;
      font-display: block;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1600px;
      height: 1200px;
      overflow: hidden;
      background: #f8fafc;
      font-family: 'NotoSansSC', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #0f172a;
      position: relative;
    }

    .bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 20%, #ffffff 0%, rgba(241, 245, 249, 0.95) 55%, #e2e8f0 100%);
      z-index: 1;
    }

    .top-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #2563eb, #38bdf8, #6366f1);
      z-index: 10;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 40px 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 顶部 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
    }

    .brand-title {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: -0.5px;
    }

    .brand-badge {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      font-size: 14px;
      padding: 3px 12px;
      border-radius: 9999px;
    }

    .top-pill {
      background: #0f172a;
      color: #ffffff;
      padding: 8px 22px;
      border-radius: 9999px;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
    }

    /* 核心超大字文案 */
    .hero-center {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 5px;
    }

    .eyebrow-tag {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      padding: 6px 22px;
      border-radius: 9999px;
      font-size: 18px;
      font-weight: 700;
    }

    .hero-h1 {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.15;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .hero-h1 .blue {
      color: #2563eb;
    }

    /* 中部键盘性能实机大图 */
    .showcase-window-box {
      width: 100%;
      max-width: 1160px;
      margin: 6px auto;
      position: relative;
    }

    .corner-badge {
      position: absolute;
      top: -14px;
      right: 32px;
      background: #2563eb;
      color: #ffffff;
      padding: 6px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
      z-index: 10;
    }

    .window-card {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 
        0 20px 50px rgba(15, 23, 42, 0.12),
        0 4px 16px rgba(15, 23, 42, 0.05);
    }

    .win-head {
      background: #f1f5f9;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
    }

    .dots {
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }
    .dot.r { background: #f87171; }
    .dot.y { background: #fbbf24; }
    .dot.g { background: #34d399; }

    .win-title {
      font-size: 14px;
      font-weight: 700;
      color: #334155;
    }

    .win-status {
      font-size: 13px;
      font-weight: 700;
      color: #2563eb;
      background: #dbeafe;
      padding: 3px 10px;
      border-radius: 9999px;
    }

    .win-img {
      width: 100%;
      height: auto;
      display: block;
      background: #ffffff;
    }

    /* 4 大交互指标卡片 */
    .metric-pills {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      max-width: 1160px;
      width: 100%;
      margin: 0 auto;
    }

    .metric-pill-item {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 18px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.03);
    }

    .metric-pill-item.active {
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .pill-val {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 2px;
    }

    .metric-pill-item.active .pill-val {
      color: #1d4ed8;
    }

    .pill-lbl {
      font-size: 15px;
      font-weight: 700;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="top-accent-bar"></div>
  <div class="bg"></div>

  <div class="container">
    <!-- 头部 -->
    <header class="header">
      <div class="brand-wrap">
        <img class="brand-logo" src="assets/logo.png" alt="AstraFlux">
        <div class="brand-title">
          ASTRAFLUX-HUB
          <span class="brand-badge">最新正式版</span>
        </div>
      </div>

      <div class="top-pill">
        【玩家自制】星闪悦动 磁轴专属驱动
      </div>
    </header>

    <!-- 核心文字区 -->
    <section class="hero-center">
      <div class="eyebrow-tag">
        玩家自制开源 · 交互极简舒服 · 告别原厂繁琐
      </div>

      <h1 class="hero-h1">
        原厂驱动太难用？<br>
        换上 <span class="blue">纯净自制驱动</span>，星闪磁轴手感直观掌控！
      </h1>
    </section>

    <!-- 中部浅色实机大图 -->
    <div class="showcase-window-box">
      <div class="corner-badge">
        键盘触发配置页面
      </div>

      <div class="window-card">
        <div class="win-head">
          <div class="dots">
            <div class="dot r"></div>
            <div class="dot y"></div>
            <div class="dot g"></div>
          </div>
          <div class="win-title">AstraFlux-HUB | 键盘触发行程与死区配置</div>
          <div class="win-status">实时联动</div>
        </div>
        <img class="win-img" src="assets/latest_light/v113_light_trigger.png" alt="键盘触发配置界面">
      </div>
    </div>

    <!-- 4 大交互指标大字卡 -->
    <div class="metric-pills">
      <div class="metric-pill-item active">
        <div class="pill-val">直观可视</div>
        <div class="pill-lbl">按键行程一目了然</div>
      </div>

      <div class="metric-pill-item">
        <div class="pill-val">纯净 0 后台</div>
        <div class="pill-lbl">绝不偷跑开机自启</div>
      </div>

      <div class="metric-pill-item">
        <div class="pill-val">丝滑联动</div>
        <div class="pill-lbl">曲线实时拖拽调节</div>
      </div>

      <div class="metric-pill-item">
        <div class="pill-val">零门槛上手</div>
        <div class="pill-lbl">界面清爽直观舒适</div>
      </div>
    </div>
  </div>
</body>
</html>
