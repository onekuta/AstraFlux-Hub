<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>视频封面 03 - 直观可视交互</title>
  <style>
    @font-face {
      font-family: 'NotoSansSC';
      src: url('./assets/fonts/NotoSansSC-chinese-simplified-700.woff2') format('woff2');
      font-weight: 700;
      font-display: block;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #f8fafc;
      font-family: 'NotoSansSC', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #0f172a;
      position: relative;
    }

    .bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 18% 25%, #ffffff 0%, rgba(241, 245, 249, 0.9) 55%, #e2e8f0 100%);
      z-index: 1;
    }

    .top-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #0284c7, #2563eb, #7c3aed);
      z-index: 10;
    }

    .layout {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 60px 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 50px;
    }

    .left-col {
      flex: 0.92;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 22px;
      font-weight: 700;
      width: fit-content;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
    }

    .pill-badge .highlight {
      color: #38bdf8;
    }

    .main-title {
      font-size: 88px;
      font-weight: 700;
      line-height: 1.12;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .main-title .blue {
      color: #2563eb;
    }

    .sub-hook {
      font-size: 30px;
      font-weight: 700;
      color: #475569;
      line-height: 1.4;
    }

    .sub-hook .bold-black {
      color: #0f172a;
    }

    .ux-cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 6px;
    }

    .ux-card-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px 26px;
      width: fit-content;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }

    .ux-card-item.primary {
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .ux-icon-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #2563eb;
    }

    .ux-card-text {
      font-size: 26px;
      font-weight: 700;
      color: #1e293b;
    }

    .ux-card-text span {
      color: #2563eb;
    }

    .chips-row {
      display: flex;
      gap: 14px;
    }

    .chip-item {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }

    .right-col {
      flex: 1.38;
      position: relative;
      perspective: 1400px;
    }

    .corner-tag {
      position: absolute;
      top: -16px;
      right: 40px;
      background: #2563eb;
      color: #ffffff;
      padding: 8px 24px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.28);
      z-index: 10;
    }

    .window-frame {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 20px;
      overflow: hidden;
      transform: rotateY(-10deg) rotateX(3deg) scale(1.08);
      transform-origin: center right;
      box-shadow: 
        -25px 35px 80px rgba(15, 23, 42, 0.18),
        0 4px 20px rgba(15, 23, 42, 0.06);
    }

    .win-bar {
      background: #f1f5f9;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.r { background: #f87171; }
    .dot.y { background: #fbbf24; }
    .dot.g { background: #34d399; }

    .win-title {
      font-size: 15px;
      font-weight: 700;
      color: #334155;
    }

    .win-badge {
      font-size: 13px;
      font-weight: 700;
      color: #2563eb;
      background: #dbeafe;
      padding: 4px 12px;
      border-radius: 9999px;
    }

    .win-img {
      width: 100%;
      height: auto;
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="top-accent-bar"></div>
  <div class="bg"></div>

  <div class="layout">
    <!-- 左侧超大字 -->
    <div class="left-col">
      <div class="pill-badge">
        <span>【玩家自制】</span>
        <span class="highlight">星闪悦动磁轴方案专属</span>
      </div>

      <h1 class="main-title">
        行程直观可视<br>
        调校 <span class="blue">从未如此丝滑！</span>
      </h1>

      <div class="sub-hook">
        按键死区实时拖拽 · <span class="bold-black">新手也能一秒上手</span>
      </div>

      <div class="ux-cards">
        <div class="ux-card-item primary">
          <div class="ux-icon-dot"></div>
          <div class="ux-card-text">
            <span>动态曲线交互</span> · 毫秒级界面联动，告别盲调
          </div>
        </div>

        <div class="chips-row">
          <div class="chip-item">纯净开源 · 零广告零后台</div>
          <div class="chip-item">星闪悦动磁轴键盘方案专属</div>
        </div>
      </div>
    </div>

    <!-- 右侧浅色实机设置窗口 -->
    <div class="right-col">
      <div class="corner-tag">
        直观可视调校页
      </div>

      <div class="window-frame">
        <div class="win-bar">
          <div class="dots">
            <div class="dot r"></div>
            <div class="dot y"></div>
            <div class="dot g"></div>
          </div>
          <div class="win-title">AstraFlux-HUB | 磁轴参数可视标定</div>
          <div class="win-badge">实时联动</div>
        </div>
        <img class="win-img" src="assets/latest_light/v113_light_performance.png" alt="直观可视界面">
      </div>
    </div>
  </div>
</body>
</html>
